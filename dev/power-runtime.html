<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>치즈모아 방송 실행 어댑터 검증</title><style>body{font:16px/1.55 system-ui;max-width:980px;margin:auto;padding:30px;background:#f3f6fb;color:#172c40}section{background:white;border-radius:12px;padding:24px;margin:20px 0}button,select{font:inherit;border:1px solid #7791aa;background:white;border-radius:8px;padding:10px;margin:4px}button{cursor:pointer}button:disabled{opacity:.5;cursor:default}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #245bc0;outline-offset:3px}h1{font-size:26px}#status{font-size:20px;font-weight:700}pre{max-height:280px;overflow:auto;white-space:pre-wrap}a{color:#204f90}</style>
<h1>방송 화면 자동수령 · 독립 검증</h1><p id="build">빌드 확인 중</p><p><strong>모의 서버 전용 · 확장 설치 불필요</strong></p><p>방송 화면용 코드와 동일한 수집기를 모의 서버에 연결합니다. 실제 치지직 보상을 받는 시험이 아니며, 기존 방송·계정·수령 기록은 변경하지 않습니다.</p>
<section><label for="condition">모의 서버</label><select id="condition"><option value="ok">정상 · 같은 적격 보상 계속 반환</option><option value="lost-start">시작 저장 후 응답 유실</option><option value="429-once">GET 429 · 120초 대기</option><option value="get-once">GET 503 후 복구</option><option value="403">PUT 403</option><option value="uncertain">PUT 응답 유실</option><option value="preflight403">사전 자격 GET 403</option></select><button id="reset">새 모의 환경</button><p>‘새 모의 환경’은 이 테스트의 기록만 초기화합니다. ‘다음 조회’는 가상 시계를 다음 예약 시각으로 이동합니다.</p><hr><button id="on">자동수령 ON</button><button id="off">자동수령 OFF</button><button id="tick">다음 조회</button><button id="restore">방송 화면 재열기 (모의)</button><button id="takeover">다른 방송 창에서 ON (모의)</button><p id="status" role="status" aria-live="polite">OFF</p><p id="detail">직접 ON을 눌러 시작하세요.</p><p id="counts">PUT 0 · 확정 0 · 미확인 0</p></section><section><h2>모의 실행 상태 기록</h2><pre id="events"></pre></section><p><a href="power-harness.html">코어 11개 시나리오 검증 화면</a></p><script type="module" src="power-runtime-ui.js"></script></html>
